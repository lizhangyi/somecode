<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据表格</title>
    <style>
        /* ========== 全局样式重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* ========== 页面布局 ========== */
        .page-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .intro-text {
            line-height: 1.8;
            color: #666;
            margin-bottom: 40px;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
        }

        /* ========== 表格核心样式（JS + fixed 实现方案） ==========
           设计思路：
           1. 表格放在独立容器中，容器有 overflow-x: auto，表格有自己的横向滚动条
           2. 原生表头正常渲染（不使用 sticky，因为 sticky 与父容器 overflow-x 冲突）
           3. 页面滚动时通过 JS 克隆一份 thead，用 position: fixed 粘在屏幕顶部
           4. 同步克隆表头的：宽度、left位置、横向滚动位置、列宽
           5. 当整个表格滚出屏幕后，隐藏克隆表头 */

        .table-wrapper {
            margin-bottom: 40px;
            background: #fff;
            border-radius: 8px;
        }

        /* 表格横向滚动容器：独立控制横向滚动
           overflow-x: auto —— 表格宽度超出容器时出现横向滚动条
           position: relative —— 作为内部克隆表头定位的参考（虽然主要用 fixed）*/
        .table-container {
            overflow-x: auto;
            position: relative;
        }

        /* 表格基础样式 */
        table {
            border-collapse: collapse;
        }

        /* 原生表头（非吸顶状态） */
        thead th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            background: #fafafa;
            border-bottom: 2px solid #e8e8e8;
            white-space: nowrap;
        }

        /* 表体单元格 */
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
            white-space: nowrap;
        }

        /* 行悬停效果 */
        tbody tr:hover td {
            background: #fafafa;
        }

        /* ========== 吸顶表头（JS 动态克隆并定位）==========
           页面滚动时，JS 会创建一个 .sticky-header-wrapper 容器，
           内部克隆一份 <thead>，用 position: fixed 固定在屏幕顶部。
           以下样式控制吸顶状态下的外观。 */

        .sticky-header-wrapper {
            /* 视觉样式由 CSS 控制，定位属性由 JS 内联设置 */
            background: #fafafa;
            border-bottom: 2px solid #e8e8e8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .sticky-header-wrapper table {
            border-collapse: collapse;
            margin: 0;
        }

        .sticky-header-wrapper thead th {
            position: static;
        }
    </style>
</head>

<body>
    <div class="page-content">
        <h1>数据表格</h1>
        <div class="intro-text">
            <p><strong>方案：JS + position: fixed 实现表头吸顶</strong></p>
            <p>4 个表格，列结构各不相同：员工信息表、商品库存表、员工合同表、订单列表。</p>
            <p>每个表格独立横向滚动，页面滚动时各自吸顶到屏幕顶部，完全滚出屏幕后消失。</p>
        </div>

        <!-- ========== 表格 1：员工信息表（11列）========== -->
        <div class="table-wrapper" data-table-id="t1">
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="t1-header"></tr>
                    </thead>
                    <tbody data-body-id="t1"></tbody>
                </table>
            </div>
        </div>

        <div class="intro-text" style="margin-top: 40px;">
            <p>第二张表格：商品库存表（10列，15行数据）。列数更少但行数更多，横向滚动条可能不同。</p>
        </div>

        <!-- ========== 表格 2：商品库存表（10列）========== -->
        <div class="table-wrapper" data-table-id="t2">
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="t2-header"></tr>
                    </thead>
                    <tbody data-body-id="t2"></tbody>
                </table>
            </div>
        </div>

        <div class="intro-text" style="margin-top: 40px;">
            <p>第三张表格：员工合同信息表（11列，8行数据）。列数与表格1相近，但内容不同。</p>
        </div>

        <!-- ========== 表格 3：员工合同信息表（11列）========== -->
        <div class="table-wrapper" data-table-id="t3">
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="t3-header"></tr>
                    </thead>
                    <tbody data-body-id="t3"></tbody>
                </table>
            </div>
        </div>

        <div class="intro-text" style="margin-top: 40px;">
            <p>第四张表格：订单列表（12列，12行数据）。列数最多，用于演示列宽差异。</p>
        </div>

        <!-- ========== 表格 4：订单列表（12列）========== -->
        <div class="table-wrapper" data-table-id="t4">
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="t4-header"></tr>
                    </thead>
                    <tbody data-body-id="t4"></tbody>
                </table>
            </div>
        </div>

        <div class="intro-text" style="margin-top: 40px; height: 800px; overflow: hidden;">
            页面底部 —— 这段内容高度 800px，用于让第四个表格完整滚出屏幕视野。
        </div>
    </div>

    <script src="sticky-table.js"></script>
    <script>
        // ========== 各表格独立配置（列结构、数据量均不同）==========
        const tableConfigs = {
            t1: {
                columns: [
                    { label: 'ID', width: 60 },
                    { label: '姓名', width: 80 },
                    { label: '邮箱', width: 200 },
                    { label: '手机号', width: 130 },
                    { label: '部门', width: 100 },
                    { label: '职位', width: 120 },
                    { label: '入职日期', width: 110 },
                    { label: '城市', width: 80 },
                    { label: '省份', width: 80 },
                    { label: '国家', width: 80 },
                    { label: '状态', width: 80 }
                ],
                rowCount: 10
            },
            t2: {
                columns: [
                    { label: '序号', width: 60 },
                    { label: '商品名称', width: 200 },
                    { label: '商品编码', width: 120 },
                    { label: '规格', width: 100 },
                    { label: '单位', width: 60 },
                    { label: '单价', width: 80 },
                    { label: '库存', width: 70 },
                    { label: '分类', width: 100 },
                    { label: '供应商', width: 120 },
                    { label: '备注', width: 150 }
                ],
                rowCount: 15
            },
            t3: {
                columns: [
                    { label: '工号', width: 80 },
                    { label: '姓名', width: 80 },
                    { label: '部门', width: 100 },
                    { label: '职位', width: 100 },
                    { label: '入职日期', width: 110 },
                    { label: '转正日期', width: 110 },
                    { label: '合同到期', width: 110 },
                    { label: '合同年限', width: 80 },
                    { label: '用工性质', width: 80 },
                    { label: '职称', width: 80 },
                    { label: '工资卡号', width: 180 }
                ],
                rowCount: 8
            },
            t4: {
                columns: [
                    { label: '订单号', width: 160 },
                    { label: '客户名称', width: 140 },
                    { label: '下单时间', width: 150 },
                    { label: '支付方式', width: 80 },
                    { label: '订单金额', width: 100 },
                    { label: '优惠金额', width: 90 },
                    { label: '实付金额', width: 100 },
                    { label: '配送地址', width: 250 },
                    { label: '收货人', width: 80 },
                    { label: '联系电话', width: 130 },
                    { label: '订单状态', width: 80 },
                    { label: '发货时间', width: 150 }
                ],
                rowCount: 12
            }
        };

        // 生成随机数据的辅助函数
        function generateRandomData(columns, rowCount) {
            const firstCol = columns[0].label;
            const data = [];
            for (let i = 1; i <= rowCount; i++) {
                const row = {};
                columns.forEach((col, idx) => {
                    if (idx === 0) {
                        // 第一列：序号/ID/工号/订单号
                        if (firstCol === '订单号') row[col.label] = `ORD${String(i).padStart(8, '0')}`;
                        else if (firstCol === '工号') row[col.label] = `EMP${String(i).padStart(5, '0')}`;
                        else if (firstCol === '商品编码') row[col.label] = `SKU${String(i).padStart(6, '0')}`;
                        else row[col.label] = i;
                    } else {
                        // 其他列随机填充内容
                        row[col.label] = `${col.label}_${i}`;
                    }
                });
                data.push(row);
            }
            return data;
        }

        // ========== 渲染所有表格（根据各表独立配置）==========
        function renderTables() {
            Object.entries(tableConfigs).forEach(([tableId, config]) => {
                // 渲染表头
                const headerRow = document.getElementById(`${tableId}-header`);
                headerRow.innerHTML = config.columns.map(col => `
                    <th style="width:${col.width}px;min-width:${col.width}px">${col.label}</th>
                `).join('');

                // 渲染表体
                const tbody = document.querySelector(`[data-body-id="${tableId}"]`);
                const data = generateRandomData(config.columns, config.rowCount);
                tbody.innerHTML = data.map(row => `
                    <tr>
                        ${config.columns.map(col => `<td>${row[col.label]}</td>`).join('')}
                    </tr>
                `).join('');

                // 设置表格宽度 = 各列宽度之和
                const totalWidth = config.columns.reduce((sum, col) => sum + col.width, 0);
                const table = document.querySelector(`[data-table-id="${tableId}"] table`);
                table.style.width = totalWidth + 'px';
            });
        }

        // ========== 初始化 ==========
        renderTables();

        // 使用 StickyTable 插件实现表头吸顶
        // 每个 .table-wrapper 独立创建实例，互不干扰
        document.querySelectorAll('.table-wrapper').forEach(el => {
            new StickyTable(el);
        });
    </script>
</body>
</html>
