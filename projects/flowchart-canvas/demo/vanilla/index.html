<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowChart Canvas — Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='4' width='10' height='8' rx='2' fill='%234e7eff'/><rect x='20' y='20' width='10' height='8' rx='2' fill='%2300b894'/><path d='M12 8 L20 20' stroke='%237878b4' stroke-width='2' fill='none' marker-end='url(%23a)'/><defs><marker id='a' markerWidth='6' markerHeight='6' refX='4' refY='3' orient='auto'><path d='M0 0 L6 3 L0 6' fill='%237878b4'/></marker></defs></svg>" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar" class="toolbar">
      <div class="toolbar-left">
        <button class="tool-btn" id="btn-export" title="导出 JSON">💾</button>
        <button class="tool-btn" id="btn-import" title="导入 JSON">📂</button>
        <input type="file" id="file-input" accept=".json" style="display:none" />
      </div>

      <div class="toolbar-center">
        <div class="toolbar-group">
          <button class="tool-btn" id="shape-btn" title="添加节点">▭</button>
          <div id="shape-dropdown" class="shape-dropdown">
            <div class="shape-option" data-shape="rect"><span>▭</span> 矩形</div>
            <div class="shape-option" data-shape="round-rect"><span>▢</span> 圆角矩形</div>
            <div class="shape-option" data-shape="diamond"><span>◇</span> 菱形</div>
            <div class="shape-option" data-shape="circle"><span>○</span> 圆形</div>
          </div>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="tool-btn" data-action="undo" title="撤销 (Ctrl+Z)">↶</button>
          <button class="tool-btn" data-action="redo" title="重做 (Ctrl+Y)">↷</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="tool-btn" data-action="zoom-out" title="缩小">−</button>
          <span id="zoom-display" class="zoom-display">100%</span>
          <button class="tool-btn" data-action="zoom-in" title="放大">+</button>
          <button class="tool-btn" data-action="fit" title="适配视图">⤢</button>
          <button class="tool-btn" data-action="toggle-snap" title="对齐网格">⊞</button>
          <button class="tool-btn" id="toggle-line-type" data-action="toggle-line-type" title="连线类型">⟰</button>
          <button class="tool-btn" id="theme-btn" title="主题">🌙</button>
        </div>
      </div>
    </div>

    <!-- Main area -->
    <div class="main-area">
      <div id="canvas-container" class="canvas-container">
        <canvas id="canvas"></canvas>
      </div>

      <!-- Property Panel -->
      <div id="property-panel" class="property-panel">
        <div class="property-empty">选中节点以编辑属性</div>
        <div class="property-content" style="display:none">
          <div class="property-row">
            <label>类型</label>
            <span id="prop-shape"></span>
          </div>
          <div class="property-row property-row-text">
            <label>文字</label>
            <textarea id="prop-text" rows="3"></textarea>
          </div>
          <div class="property-row">
            <label>宽度</label>
            <input id="prop-width" type="number" min="40" max="400" />
          </div>
          <div class="property-row">
            <label>高度</label>
            <input id="prop-height" type="number" min="30" max="300" />
          </div>
          <div class="property-row">
            <label>颜色</label>
            <input id="prop-color" type="color" />
          </div>
          <div class="property-row">
            <button id="prop-delete" class="delete-btn">删除节点</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
