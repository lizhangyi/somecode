<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - Snake Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a1a;
            --neon-green: #00ff88;
            --neon-pink: #ff0080;
            --neon-purple: #9d00ff;
            --grid-line: #1a1a2e;
        }

        /* 主题：霓虹蓝 */
        body.theme-neon-blue {
            --bg-dark: #0a0f1a;
            --neon-green: #00ccff;
            --neon-pink: #ff6600;
            --neon-purple: #0066ff;
            --grid-line: #1a2a3e;
        }

        /* 主题：火焰红 */
        body.theme-fire-red {
            --bg-dark: #1a0a0a;
            --neon-green: #ff4444;
            --neon-pink: #ffaa00;
            --neon-purple: #ff0066;
            --grid-line: #2e1a1a;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--neon-green);
        }

        /* CRT 扫描线效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 
                0 0 10px var(--neon-green),
                0 0 20px var(--neon-green),
                0 0 40px var(--neon-green);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 10px var(--neon-green),
                    0 0 20px var(--neon-green),
                    0 0 40px var(--neon-green);
            }
            to {
                text-shadow: 
                    0 0 20px var(--neon-green),
                    0 0 40px var(--neon-green),
                    0 0 80px var(--neon-green);
            }
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
        }

        .score-board span {
            text-shadow: 0 0 5px var(--neon-green);
        }

        .high-score {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        #gameCanvas {
            border: 3px solid var(--neon-purple);
            border-radius: 8px;
            box-shadow: 
                0 0 20px var(--neon-purple),
                inset 0 0 20px rgba(157, 0, 255, 0.2);
            background: var(--bg-dark);
        }

        .controls {
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
        }

        .controls kbd {
            background: var(--grid-line);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            margin: 0 2px;
        }

        /* 主题切换器 */
        .theme-selector {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }

        .theme-btn.neon-green {
            background: linear-gradient(135deg, #00ff88, #00ffaa);
            box-shadow: 0 0 10px #00ff88;
        }

        .theme-btn.neon-blue {
            background: linear-gradient(135deg, #00ccff, #0066ff);
            box-shadow: 0 0 10px #00ccff;
        }

        .theme-btn.fire-red {
            background: linear-gradient(135deg, #ff4444, #ffaa00);
            box-shadow: 0 0 10px #ff4444;
        }

        .theme-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.6);
            margin-right: 5px;
        }

        /* 移动端触摸提示 */
        .touch-hint {
            display: none;
            margin-top: 15px;
            font-size: 10px;
            color: var(--neon-pink);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 18px;
            }
            .score-board {
                font-size: 10px;
                padding: 8px 15px;
            }
            .controls {
                font-size: 8px;
            }
            .touch-hint {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>SNAKE GAME</h1>
        <div class="score-board">
            <span>SCORE: <span id="score">0</span></span>
            <span class="high-score">BEST: <span id="highScore">0</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <kbd>SPACE</kbd> 开始/暂停/重新开始 &nbsp;&nbsp;
            <kbd>P</kbd> 暂停 &nbsp;&nbsp;
            <kbd>方向键</kbd> 或 <kbd>WASD</kbd> 移动
        </div>
        <div class="theme-selector">
            <span class="theme-label">THEME:</span>
            <button class="theme-btn neon-green active" data-theme="neon-green" title="霓虹绿"></button>
            <button class="theme-btn neon-blue" data-theme="neon-blue" title="霓虹蓝"></button>
            <button class="theme-btn fire-red" data-theme="fire-red" title="火焰红"></button>
        </div>
        <div class="touch-hint">
            移动端：滑动屏幕控制方向
        </div>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            gridSize: 30,
            cellSize: 25,
            baseSpeed: 150,
            minSpeed: 50,
            speedDecrement: 10,
            speedIncreaseScore: 50,
            portalEnabled: true,
            portalPairs: 1,
            portalCooldown: 300,
            colors: {
                snake: '#00ff88',
                snakeHead: '#00ffaa',
                food: '#ff0080',
                grid: '#1a1a2e',
                background: '#0a0a1a',
                portal: '#9d00ff',
                portalGlow: '#ff00ff'
            }
        };

        // 传送门
        const portals = [];
        let portalTimer = 0;

        // 游戏状态
        const GAME_STATE = {
            IDLE: 'idle',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAME_OVER: 'game_over'
        };

        // 方向
        const DIRECTION = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        // Canvas 设置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.gridSize * CONFIG.cellSize;
        canvas.height = CONFIG.gridSize * CONFIG.cellSize;

        // 游戏变量
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = DIRECTION.RIGHT;
        let nextDirection = DIRECTION.RIGHT;
        let gameState = GAME_STATE.IDLE;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameLoop = null;
        let foodPulse = 0;
        let currentSpeed = CONFIG.baseSpeed;
        let lastSpeedIncreaseScore = 0;

        // DOM 元素
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const themeButtons = document.querySelectorAll('.theme-btn');

        // 主题配置
        const THEMES = {
            'neon-green': {
                snake: '#00ff88',
                snakeHead: '#00ffaa',
                food: '#ff0080',
                grid: '#1a1a2e',
                background: '#0a0a1a',
                portal: '#9d00ff',
                portalGlow: '#ff00ff'
            },
            'neon-blue': {
                snake: '#00ccff',
                snakeHead: '#00eeff',
                food: '#ff6600',
                grid: '#1a2a3e',
                background: '#0a0f1a',
                portal: '#0066ff',
                portalGlow: '#00aaff'
            },
            'fire-red': {
                snake: '#ff4444',
                snakeHead: '#ff6666',
                food: '#ffaa00',
                grid: '#2e1a1a',
                background: '#1a0a0a',
                portal: '#ff0066',
                portalGlow: '#ff3388'
            }
        };

        // 初始化
        function init() {
            highScoreEl.textContent = highScore;
            loadTheme();
            renderStartScreen();
            setupControls();
            setupThemeSelector();
        }

        // 加载主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('snake_theme') || 'neon-green';
            applyTheme(savedTheme);
        }

        // 应用主题
        function applyTheme(themeName) {
            // 移除所有主题类
            document.body.classList.remove('theme-neon-blue', 'theme-fire-red');
            
            // 添加新主题类
            if (themeName === 'neon-blue') {
                document.body.classList.add('theme-neon-blue');
            } else if (themeName === 'fire-red') {
                document.body.classList.add('theme-fire-red');
            }
            
            // 更新CONFIG颜色
            const theme = THEMES[themeName];
            if (theme) {
                CONFIG.colors = { ...theme };
            }
            
            // 更新按钮状态
            themeButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.theme === themeName) {
                    btn.classList.add('active');
                }
            });
            
            // 保存主题
            localStorage.setItem('snake_theme', themeName);
        }

        // 设置主题选择器
        function setupThemeSelector() {
            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const theme = btn.dataset.theme;
                    applyTheme(theme);
                    
                    // 如果游戏正在进行，重新渲染
                    if (gameState === GAME_STATE.PLAYING || gameState === GAME_STATE.PAUSED) {
                        render();
                    } else if (gameState === GAME_STATE.IDLE) {
                        renderStartScreen();
                    } else if (gameState === GAME_STATE.GAME_OVER) {
                        renderGameOver();
                    }
                });
            });
        }

        // 开始游戏
        function startGame() {
            // 重置蛇
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = DIRECTION.RIGHT;
            nextDirection = DIRECTION.RIGHT;
            score = 0;
            scoreEl.textContent = score;
            currentSpeed = CONFIG.baseSpeed;
            lastSpeedIncreaseScore = 0;
            
            // 重置传送门
            portals.length = 0;
            portalTimer = 0;
            generatePortals();
            
            // 生成食物
            generateFood();
            
            // 开始游戏循环
            gameState = GAME_STATE.PLAYING;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, currentSpeed);
            
            // 启动渲染循环
            requestAnimationFrame(render);
        }
        
        // 生成传送门
        function generatePortals() {
            if (!CONFIG.portalEnabled) return;
            
            portals.length = 0;
            
            for (let i = 0; i < CONFIG.portalPairs; i++) {
                let pointA, pointB;
                let attempts = 0;
                
                do {
                    pointA = getRandomEmptyPosition();
                    attempts++;
                } while (attempts < 100 && (
                    isOnSnake(pointA.x, pointA.y) ||
                    isOnFood(pointA.x, pointA.y)
                ));
                
                if (attempts >= 100) continue;
                
                attempts = 0;
                do {
                    pointB = getRandomEmptyPosition();
                    attempts++;
                } while (attempts < 100 && (
                    isOnSnake(pointB.x, pointB.y) ||
                    isOnFood(pointB.x, pointB.y) ||
                    (pointA.x === pointB.x && pointA.y === pointB.y) ||
                    (Math.abs(pointB.x - pointA.x) + Math.abs(pointB.y - pointA.y) < 5)
                ));
                
                if (attempts < 100) {
                    portals.push({
                        pointA: pointA,
                        pointB: pointB,
                        spiralA: 0,
                        spiralB: Math.PI,
                        pulse: Math.random() * Math.PI * 2
                    });
                }
            }
        }
        
        // 获取随机空位置
        function getRandomEmptyPosition() {
            return {
                x: Math.floor(Math.random() * CONFIG.gridSize),
                y: Math.floor(Math.random() * CONFIG.gridSize)
            };
        }
        
        // 检查是否在蛇身上
        function isOnSnake(x, y) {
            return snake.some(seg => seg.x === x && seg.y === y);
        }
        
        // 检查是否在食物上
        function isOnFood(x, y) {
            return food.x === x && food.y === y;
        }
        
        // 检查是否在传送门上
        function isOnPortal(x, y) {
            return portals.some(p => 
                (p.pointA.x === x && p.pointA.y === y) ||
                (p.pointB.x === x && p.pointB.y === y)
            );
        }

        // 生成食物
        function generateFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * CONFIG.gridSize);
                food.y = Math.floor(Math.random() * CONFIG.gridSize);
                valid = !snake.some(seg => seg.x === food.x && seg.y === food.y) &&
                        !isOnPortal(food.x, food.y);
            }
        }

        // 游戏更新
        function update() {
            if (gameState !== GAME_STATE.PLAYING) return;
            
            // 更新方向
            direction = nextDirection;
            
            // 计算新头部位置
            let head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };
            
            // 穿墙处理
            if (head.x < 0) {
                head.x = CONFIG.gridSize - 1;
            } else if (head.x >= CONFIG.gridSize) {
                head.x = 0;
            }
            if (head.y < 0) {
                head.y = CONFIG.gridSize - 1;
            } else if (head.y >= CONFIG.gridSize) {
                head.y = 0;
            }
            
            // 传送门检测
            let teleported = false;
            for (const portal of portals) {
                // 从 pointA 传送到 pointB
                if (head.x === portal.pointA.x && head.y === portal.pointA.y) {
                    head.x = portal.pointB.x + direction.x;
                    head.y = portal.pointB.y + direction.y;
                    teleported = true;
                }
                // 从 pointB 传送到 pointA
                else if (head.x === portal.pointB.x && head.y === portal.pointB.y) {
                    head.x = portal.pointA.x + direction.x;
                    head.y = portal.pointA.y + direction.y;
                    teleported = true;
                }
                
                if (teleported) {
                    // 处理穿墙
                    if (head.x < 0) {
                        head.x = CONFIG.gridSize - 1;
                    } else if (head.x >= CONFIG.gridSize) {
                        head.x = 0;
                    }
                    if (head.y < 0) {
                        head.y = CONFIG.gridSize - 1;
                    } else if (head.y >= CONFIG.gridSize) {
                        head.y = 0;
                    }
                    
                    // 传送后刷新位置
                    generatePortals();
                    break;
                }
            }
            
            // 碰撞检测 - 自身（传送后可能撞到自己）
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }
            
            // 添加新头部
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                generateFood();
                
                // 检查是否需要增加速度
                if (score - lastSpeedIncreaseScore >= CONFIG.speedIncreaseScore) {
                    increaseSpeed();
                    lastSpeedIncreaseScore = score;
                }
            } else {
                // 没吃到食物，移除尾巴
                snake.pop();
            }
        }

        // 增加速度
        function increaseSpeed() {
            if (currentSpeed > CONFIG.minSpeed) {
                currentSpeed = Math.max(CONFIG.minSpeed, currentSpeed - CONFIG.speedDecrement);
                if (gameState === GAME_STATE.PLAYING) {
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, currentSpeed);
                }
            }
        }

        // 游戏结束
        function gameOver() {
            gameState = GAME_STATE.GAME_OVER;
            if (gameLoop) clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore);
                highScoreEl.textContent = highScore;
            }
            
            renderGameOver();
        }

        // 暂停/继续
        function togglePause() {
            if (gameState === GAME_STATE.PLAYING) {
                gameState = GAME_STATE.PAUSED;
                if (gameLoop) clearInterval(gameLoop);
            } else if (gameState === GAME_STATE.PAUSED) {
                gameState = GAME_STATE.PLAYING;
                gameLoop = setInterval(update, currentSpeed);
            }
        }

        // 绘制暂停遮罩
        function drawPauseOverlay() {
            // 半透明背景
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // PAUSE文字
            ctx.textAlign = 'center';
            ctx.fillStyle = CONFIG.colors.snake;
            ctx.font = '24px "Press Start 2P"';
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 30;
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 20);
            
            // 提示文字
            ctx.font = '10px "Press Start 2P"';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 10;
            ctx.fillText('按空格键继续', canvas.width / 2, canvas.height / 2 + 30);
            
            ctx.shadowBlur = 0;
        }

        // 渲染 - 开始界面
        function renderStartScreen() {
            ctx.fillStyle = CONFIG.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            ctx.fillStyle = CONFIG.colors.snake;
            ctx.font = '14px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 20;
            ctx.fillText('按空格键开始', canvas.width / 2, canvas.height / 2);
            
            ctx.font = '10px "Press Start 2P"';
            ctx.fillStyle = CONFIG.colors.food;
            ctx.shadowColor = CONFIG.colors.food;
            ctx.fillText('SNAKE GAME', canvas.width / 2, canvas.height / 2 - 50);
            ctx.shadowBlur = 0;
        }

        // 渲染 - 游戏画面
        function render() {
            if (gameState !== GAME_STATE.PLAYING && 
                gameState !== GAME_STATE.PAUSED) return;
            
            // 清空画布
            ctx.fillStyle = CONFIG.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            drawGrid();
            
            // 绘制传送门
            drawPortals();
            
            // 绘制食物
            drawFood();
            
            // 绘制蛇
            drawSnake();
            
            // 食物脉冲动画
            foodPulse += 0.1;
            
            // 传送门螺旋和脉冲动画
            portals.forEach(p => {
                p.pulse += 0.08;
                p.spiralA += 0.15;
                p.spiralB += 0.15;
            });
            
            // 如果暂停，显示PAUSE文字
            if (gameState === GAME_STATE.PAUSED) {
                drawPauseOverlay();
            }
            
            // 继续渲染循环（包括暂停状态）
            requestAnimationFrame(render);
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = CONFIG.colors.grid;
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= CONFIG.gridSize; i++) {
                const pos = i * CONFIG.cellSize;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(canvas.width, pos);
                ctx.stroke();
            }
        }
        
        // 绘制传送门
        function drawPortals() {
            portals.forEach(portal => {
                // 绘制两个传送门点（双向）
                drawPortalPoint(portal.pointA, portal.pulse, portal.spiralA);
                drawPortalPoint(portal.pointB, portal.pulse + Math.PI * 0.5, portal.spiralB);
                
                // 绘制连接线（虚线效果）
                drawPortalConnection(portal);
            });
        }
        
        // 绘制传送门点（带螺旋效果）
        function drawPortalPoint(pos, pulse, spiral) {
            const x = pos.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y = pos.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            const baseRadius = CONFIG.cellSize / 2 - 4;
            const pulseRadius = baseRadius + Math.sin(pulse) * 2;
            
            // 发光效果
            ctx.shadowColor = CONFIG.colors.portalGlow;
            ctx.shadowBlur = 15 + Math.sin(pulse) * 8;
            
            // 螺旋效果
            drawSpiral(x, y, spiral, pulseRadius);
            
            // 外圈
            ctx.strokeStyle = CONFIG.colors.portal;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius + 3, 0, Math.PI * 2);
            ctx.stroke();
            
            // 内圈
            ctx.fillStyle = 'rgba(157, 0, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }
        
        // 绘制螺旋效果
        function drawSpiral(x, y, spiralAngle, radius) {
            const lines = 3;
            const turns = 2;
            
            for (let i = 0; i < lines; i++) {
                const lineAngle = (i / lines) * Math.PI * 2 + spiralAngle;
                ctx.strokeStyle = `rgba(255, 0, 128, ${0.4 + (i / lines) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let t = 0; t < turns * Math.PI * 2; t += 0.1) {
                    const currentAngle = lineAngle + t;
                    const r = (t / (turns * Math.PI * 2)) * radius;
                    const px = x + Math.cos(currentAngle) * r;
                    const py = y + Math.sin(currentAngle) * r;
                    
                    if (t === 0) {
                        ctx.moveTo(px, py);
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();
            }
        }
        
        // 绘制传送门连接
        function drawPortalConnection(portal) {
            const x1 = portal.pointA.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y1 = portal.pointA.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            const x2 = portal.pointB.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y2 = portal.pointB.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            
            ctx.shadowColor = CONFIG.colors.portal;
            ctx.shadowBlur = 5;
            
            // 虚线连接
            ctx.strokeStyle = 'rgba(157, 0, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.shadowBlur = 0;
        }

        // 绘制食物
        function drawFood() {
            const x = food.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y = food.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            const baseRadius = CONFIG.cellSize / 2 - 2;
            const pulseRadius = baseRadius + Math.sin(foodPulse) * 2;
            
            // 发光效果
            ctx.shadowColor = CONFIG.colors.food;
            ctx.shadowBlur = 15 + Math.sin(foodPulse) * 5;
            
            ctx.fillStyle = CONFIG.colors.food;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * CONFIG.cellSize;
                const y = segment.y * CONFIG.cellSize;
                const size = CONFIG.cellSize - 2;
                
                // 头部颜色更深
                if (index === 0) {
                    ctx.shadowColor = CONFIG.colors.snake;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = CONFIG.colors.snakeHead;
                } else {
                    // 身体渐变
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = CONFIG.colors.snake;
                    ctx.fillStyle = `rgba(0, 255, 136, ${alpha})`;
                }
                
                // 绘制圆角矩形
                const radius = 4;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, size, size, radius);
                ctx.fill();
                
                ctx.shadowBlur = 0;
            });
        }

        // 渲染 - 游戏结束
        function renderGameOver() {
            ctx.fillStyle = CONFIG.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            ctx.textAlign = 'center';
            
            // 游戏结束文字
            ctx.fillStyle = CONFIG.colors.food;
            ctx.font = '16px "Press Start 2P"';
            ctx.shadowColor = CONFIG.colors.food;
            ctx.shadowBlur = 20;
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
            
            // 分数
            ctx.fillStyle = CONFIG.colors.snake;
            ctx.font = '12px "Press Start 2P"';
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 15;
            ctx.fillText(`SCORE: ${score}`, canvas.width / 2, canvas.height / 2);
            
            // 最高分
            if (score >= highScore) {
                ctx.fillStyle = '#ffff00';
                ctx.shadowColor = '#ffff00';
                ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, canvas.height / 2 + 25);
            }
            
            // 重新开始提示
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px "Press Start 2P"';
            ctx.shadowBlur = 0;
            ctx.fillText('按空格键重新开始', canvas.width / 2, canvas.height / 2 + 60);
        }

        // 控制设置
        function setupControls() {
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case ' ':
                        e.preventDefault();
                        if (gameState === GAME_STATE.IDLE || 
                            gameState === GAME_STATE.GAME_OVER) {
                            startGame();
                        } else if (gameState === GAME_STATE.PLAYING || 
                                   gameState === GAME_STATE.PAUSED) {
                            togglePause();
                        }
                        break;
                    case 'p':
                        togglePause();
                        break;
                    case 'arrowup':
                    case 'w':
                        if (direction !== DIRECTION.DOWN) {
                            nextDirection = DIRECTION.UP;
                        }
                        break;
                    case 'arrowdown':
                    case 's':
                        if (direction !== DIRECTION.UP) {
                            nextDirection = DIRECTION.DOWN;
                        }
                        break;
                    case 'arrowleft':
                    case 'a':
                        if (direction !== DIRECTION.RIGHT) {
                            nextDirection = DIRECTION.LEFT;
                        }
                        break;
                    case 'arrowright':
                    case 'd':
                        if (direction !== DIRECTION.LEFT) {
                            nextDirection = DIRECTION.RIGHT;
                        }
                        break;
                }
            });

            // 触摸控制
            let touchStartX = 0;
            let touchStartY = 0;

            canvas.addEventListener('touchstart', (e) => {
                if (gameState === GAME_STATE.IDLE || 
                    gameState === GAME_STATE.GAME_OVER) {
                    startGame();
                    return;
                }
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                if (gameState !== GAME_STATE.PLAYING) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;
                
                const minSwipe = 30;
                
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > minSwipe && direction !== DIRECTION.LEFT) {
                        nextDirection = DIRECTION.RIGHT;
                    } else if (diffX < -minSwipe && direction !== DIRECTION.RIGHT) {
                        nextDirection = DIRECTION.LEFT;
                    }
                } else {
                    if (diffY > minSwipe && direction !== DIRECTION.UP) {
                        nextDirection = DIRECTION.DOWN;
                    } else if (diffY < -minSwipe && direction !== DIRECTION.DOWN) {
                        nextDirection = DIRECTION.UP;
                    }
                }
            }, { passive: true });
        }

        // 启动游戏
        init();
    </script>
</body>
</html>
