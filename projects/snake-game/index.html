<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - Snake Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a1a;
            --neon-green: #00ff88;
            --neon-pink: #ff0080;
            --neon-purple: #9d00ff;
            --grid-line: #1a1a2e;
        }

        /* 主题：霓虹蓝 */
        body.theme-neon-blue {
            --bg-dark: #0a0f1a;
            --neon-green: #00ccff;
            --neon-pink: #ff6600;
            --neon-purple: #0066ff;
            --grid-line: #1a2a3e;
        }

        /* 主题：火焰红 */
        body.theme-fire-red {
            --bg-dark: #1a0a0a;
            --neon-green: #ff4444;
            --neon-pink: #ffaa00;
            --neon-purple: #ff0066;
            --grid-line: #2e1a1a;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--neon-green);
        }

        /* CRT 扫描线效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 
                0 0 10px var(--neon-green),
                0 0 20px var(--neon-green),
                0 0 40px var(--neon-green);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 10px var(--neon-green),
                    0 0 20px var(--neon-green),
                    0 0 40px var(--neon-green);
            }
            to {
                text-shadow: 
                    0 0 20px var(--neon-green),
                    0 0 40px var(--neon-green),
                    0 0 80px var(--neon-green);
            }
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
        }

        .score-board span {
            text-shadow: 0 0 5px var(--neon-green);
        }

        .high-score {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        #gameCanvas {
            border: 3px solid var(--neon-purple);
            border-radius: 8px;
            box-shadow: 
                0 0 20px var(--neon-purple),
                inset 0 0 20px rgba(157, 0, 255, 0.2);
            background: var(--bg-dark);
        }

        .controls {
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
        }

        .controls kbd {
            background: var(--grid-line);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            margin: 0 2px;
        }

        /* 主题切换器 */
        .theme-selector {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }

        .theme-btn.neon-green {
            background: linear-gradient(135deg, #00ff88, #00ffaa);
            box-shadow: 0 0 10px #00ff88;
        }

        .theme-btn.neon-blue {
            background: linear-gradient(135deg, #00ccff, #0066ff);
            box-shadow: 0 0 10px #00ccff;
        }

        .theme-btn.fire-red {
            background: linear-gradient(135deg, #ff4444, #ffaa00);
            box-shadow: 0 0 10px #ff4444;
        }

        .mute-btn {
            background: var(--grid-line);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mute-btn:hover {
            box-shadow: 0 0 15px var(--neon-green);
            transform: scale(1.1);
        }

        .mute-btn.muted {
            border-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.3);
        }

        .theme-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.6);
            margin-right: 5px;
        }

        /* 移动端触摸提示 */
        .touch-hint {
            display: none;
            margin-top: 15px;
            font-size: 10px;
            color: var(--neon-pink);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 18px;
            }
            .score-board {
                font-size: 10px;
                padding: 8px 15px;
            }
            .controls {
                font-size: 8px;
            }
            .touch-hint {
                display: block;
            }
        }
        .history-open-btn {
            background: var(--grid-line);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-open-btn:hover {
            box-shadow: 0 0 15px var(--neon-green);
            transform: scale(1.1);
        }

        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .history-panel {
            background: var(--bg-dark);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px var(--neon-green);
        }

        .history-panel h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: var(--neon-green);
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            min-height: 100px;
            max-height: 50vh;
            margin-bottom: 15px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 2px;
        }

        .history-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 20px;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--grid-line);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--neon-green);
        }

        .history-row:first-of-type {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .history-row .rank {
            width: 30px;
            text-align: center;
            color: var(--neon-purple);
        }

        .history-row .score {
            flex: 1;
            text-align: center;
        }

        .history-row .length {
            width: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .history-row .date {
            width: 90px;
            text-align: right;
            color: rgba(255, 255, 255, 0.4);
            font-size: 8px;
        }

        .history-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .history-action-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 8px 16px;
            background: var(--grid-line);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .history-action-btn:hover {
            background: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--neon-green);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>SNAKE GAME</h1>
        <div class="score-board">
            <span>SCORE: <span id="score">0</span></span>
            <span class="high-score">BEST: <span id="highScore">0</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <kbd>SPACE</kbd> 开始/暂停/重新开始 &nbsp;&nbsp;
            <kbd>P</kbd> 暂停 &nbsp;&nbsp;
            <kbd>方向键</kbd> 或 <kbd>WASD</kbd> 移动
        </div>
        <div class="theme-selector">
            <span class="theme-label">THEME:</span>
            <button class="theme-btn neon-green active" data-theme="neon-green" title="霓虹绿"></button>
            <button class="theme-btn neon-blue" data-theme="neon-blue" title="霓虹蓝"></button>
            <button class="theme-btn fire-red" data-theme="fire-red" title="火焰红"></button>
            <button class="mute-btn" id="muteBtn" title="音效开关">🔊</button>
            <button class="history-open-btn" id="historyBtn" title="历史得分">📊</button>
        </div>
        <div class="touch-hint">
            移动端：滑动屏幕控制方向
        </div>
    </div>

    <!-- 历史得分弹窗 -->
    <div class="history-overlay" id="historyOverlay" style="display:none">
        <div class="history-panel">
            <h2>HISTORY</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">暂无记录</div>
            </div>
            <div class="history-actions">
                <button class="history-action-btn" id="clearHistoryBtn">CLEAR</button>
                <button class="history-action-btn" id="closeHistoryBtn">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            gridSize: 30,
            cellSize: 25,
            baseSpeed: 150,
            minSpeed: 50,
            speedDecrement: 10,
            speedIncreaseScore: 50,
            portalEnabled: true,
            portalPairs: 1,
            portalCooldown: 300,
            colors: {
                snake: '#00ff88',
                snakeHead: '#00ffaa',
                food: '#ff0080',
                grid: '#1a1a2e',
                background: '#0a0a1a',
                portal: '#9d00ff',
                portalGlow: '#ff00ff'
            }
        };

        // 传送门
        const portals = [];
        let portalTimer = 0;

        // 游戏状态
        const GAME_STATE = {
            IDLE: 'idle',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAME_OVER: 'game_over'
        };

        // 方向
        const DIRECTION = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        // Canvas 设置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.gridSize * CONFIG.cellSize;
        canvas.height = CONFIG.gridSize * CONFIG.cellSize;

        // 游戏变量
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = DIRECTION.RIGHT;
        let nextDirection = DIRECTION.RIGHT;
        let gameState = GAME_STATE.IDLE;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameLoop = null;
        let foodPulse = 0;
        let currentSpeed = CONFIG.baseSpeed;
        let lastSpeedIncreaseScore = 0;

        // 加速系统
        let boosting = false;
        let boostTicks = 0;
        let boostCooldownEnd = 0;
        const boostTrail = [];
        const BOOST_TICKS = 6;
        const BOOST_INTERVAL = 30;
        const BOOST_COOLDOWN = 2000;
        const BOOST_TRAIL_MAX = 8;

        // 音效系统
        const SoundFX = {
            ctx: null,
            muted: false,

            init() {
                if (this.ctx) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('Web Audio API 不可用');
                }
            },

            getCtx() {
                this.init();
                return this.ctx;
            },

            toggleMute() {
                this.muted = !this.muted;
                localStorage.setItem('snake_muted', this.muted ? '1' : '0');
                return this.muted;
            },

            loadMuteState() {
                this.muted = localStorage.getItem('snake_muted') === '1';
            },

            playEat() {
                if (this.muted) return;
                const ctx = this.getCtx(); if (!ctx) return;
                const now = ctx.currentTime;
                [0, 0.05].forEach((delay, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800 + i * 300, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(1600 + i * 300, now + delay + 0.06);
                    gain.gain.setValueAtTime(0.12, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.1);
                });
            },

            playDeath() {
                if (this.muted) return;
                const ctx = this.getCtx(); if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.connect(gain).connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            },

            playPortal() {
                if (this.muted) return;
                const ctx = this.getCtx(); if (!ctx) return;
                const now = ctx.currentTime;
                const buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
                }
                const noise = ctx.createBufferSource();
                const filter = ctx.createBiquadFilter();
                const gain = ctx.createGain();
                noise.buffer = buf;
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2000, now);
                filter.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                filter.Q.setValueAtTime(0.5, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                noise.connect(filter).connect(gain).connect(ctx.destination);
                noise.start(now);
                noise.stop(now + 0.2);
            },

            playHighScore() {
                if (this.muted) return;
                const ctx = this.getCtx(); if (!ctx) return;
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    const t = now + i * 0.12;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.15);
                });
            },

            playStart() {
                if (this.muted) return;
                const ctx = this.getCtx(); if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(660, now + 0.06);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain).connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        };

        // DOM 元素
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const themeButtons = document.querySelectorAll('.theme-btn');

        // 主题配置
        const THEMES = {
            'neon-green': {
                snake: '#00ff88',
                snakeHead: '#00ffaa',
                food: '#ff0080',
                grid: '#1a1a2e',
                background: '#0a0a1a',
                portal: '#9d00ff',
                portalGlow: '#ff00ff'
            },
            'neon-blue': {
                snake: '#00ccff',
                snakeHead: '#00eeff',
                food: '#ff6600',
                grid: '#1a2a3e',
                background: '#0a0f1a',
                portal: '#0066ff',
                portalGlow: '#00aaff'
            },
            'fire-red': {
                snake: '#ff4444',
                snakeHead: '#ff6666',
                food: '#ffaa00',
                grid: '#2e1a1a',
                background: '#1a0a0a',
                portal: '#ff0066',
                portalGlow: '#ff3388'
            }
        };

        // 初始化
        function init() {
            highScoreEl.textContent = highScore;
            loadTheme();
            renderStartScreen();
            setupControls();
            setupThemeSelector();
            setupMuteButton();
            setupHistoryButton();
        }

        // 加载主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('snake_theme') || 'neon-green';
            applyTheme(savedTheme);
        }

        // 应用主题
        function applyTheme(themeName) {
            // 移除所有主题类
            document.body.classList.remove('theme-neon-blue', 'theme-fire-red');
            
            // 添加新主题类
            if (themeName === 'neon-blue') {
                document.body.classList.add('theme-neon-blue');
            } else if (themeName === 'fire-red') {
                document.body.classList.add('theme-fire-red');
            }
            
            // 更新CONFIG颜色
            const theme = THEMES[themeName];
            if (theme) {
                CONFIG.colors = { ...theme };
            }
            
            // 更新按钮状态
            themeButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.theme === themeName) {
                    btn.classList.add('active');
                }
            });
            
            // 保存主题
            localStorage.setItem('snake_theme', themeName);
        }

        // 设置主题选择器
        function setupThemeSelector() {
            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const theme = btn.dataset.theme;
                    applyTheme(theme);
                    
                    // 如果游戏正在进行，重新渲染
                    if (gameState === GAME_STATE.PLAYING || gameState === GAME_STATE.PAUSED) {
                        render();
                    } else if (gameState === GAME_STATE.IDLE) {
                        renderStartScreen();
                    } else if (gameState === GAME_STATE.GAME_OVER) {
                        renderGameOver();
                    }
                });
            });
        }

        // 激活加速
        function activateBoost() {
            if (boosting || Date.now() < boostCooldownEnd) return;
            boosting = true;
            boostTicks = BOOST_TICKS;
            boostTrail.length = 0;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, BOOST_INTERVAL);
        }

        // 结束加速
        function endBoost() {
            boosting = false;
            boostCooldownEnd = Date.now() + BOOST_COOLDOWN;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, currentSpeed);
        }

        // 开始游戏
        function startGame() {
            // 重置蛇
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = DIRECTION.RIGHT;
            nextDirection = DIRECTION.RIGHT;
            score = 0;
            scoreEl.textContent = score;
            currentSpeed = CONFIG.baseSpeed;
            lastSpeedIncreaseScore = 0;
            
            // 重置加速
            boosting = false;
            boostTicks = 0;
            boostCooldownEnd = 0;
            boostTrail.length = 0;
            
            // 重置传送门
            portals.length = 0;
            portalTimer = 0;
            generatePortals();
            
            // 生成食物
            generateFood();
            
            // 开始游戏循环
            gameState = GAME_STATE.PLAYING;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, currentSpeed);
            
            // 启动渲染循环
            requestAnimationFrame(render);
            
            SoundFX.playStart();
        }
        
        // 生成传送门
        function generatePortals() {
            if (!CONFIG.portalEnabled) return;
            
            portals.length = 0;
            
            for (let i = 0; i < CONFIG.portalPairs; i++) {
                let pointA, pointB;
                let attempts = 0;
                
                do {
                    pointA = getRandomEmptyPosition();
                    attempts++;
                } while (attempts < 100 && (
                    isOnSnake(pointA.x, pointA.y) ||
                    isOnFood(pointA.x, pointA.y)
                ));
                
                if (attempts >= 100) continue;
                
                attempts = 0;
                do {
                    pointB = getRandomEmptyPosition();
                    attempts++;
                } while (attempts < 100 && (
                    isOnSnake(pointB.x, pointB.y) ||
                    isOnFood(pointB.x, pointB.y) ||
                    (pointA.x === pointB.x && pointA.y === pointB.y) ||
                    (Math.abs(pointB.x - pointA.x) + Math.abs(pointB.y - pointA.y) < 5)
                ));
                
                if (attempts < 100) {
                    portals.push({
                        pointA: pointA,
                        pointB: pointB,
                        spiralA: 0,
                        spiralB: Math.PI,
                        pulse: Math.random() * Math.PI * 2
                    });
                }
            }
        }
        
        // 获取随机空位置
        function getRandomEmptyPosition() {
            return {
                x: Math.floor(Math.random() * CONFIG.gridSize),
                y: Math.floor(Math.random() * CONFIG.gridSize)
            };
        }
        
        // 检查是否在蛇身上
        function isOnSnake(x, y) {
            return snake.some(seg => seg.x === x && seg.y === y);
        }
        
        // 检查是否在食物上
        function isOnFood(x, y) {
            return food.x === x && food.y === y;
        }
        
        // 检查是否在传送门上
        function isOnPortal(x, y) {
            return portals.some(p => 
                (p.pointA.x === x && p.pointA.y === y) ||
                (p.pointB.x === x && p.pointB.y === y)
            );
        }

        // 生成食物
        function generateFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * CONFIG.gridSize);
                food.y = Math.floor(Math.random() * CONFIG.gridSize);
                valid = !snake.some(seg => seg.x === food.x && seg.y === food.y) &&
                        !isOnPortal(food.x, food.y);
            }
        }

        // 游戏更新
        function update() {
            if (gameState !== GAME_STATE.PLAYING) return;
            
            // 加速计时
            if (boosting) {
                boostTicks--;
                if (boostTicks <= 0) {
                    endBoost();
                }
            }
            
            // 更新方向
            direction = nextDirection;
            
            // 计算新头部位置
            let head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };
            
            // 穿墙处理
            if (head.x < 0) {
                head.x = CONFIG.gridSize - 1;
            } else if (head.x >= CONFIG.gridSize) {
                head.x = 0;
            }
            if (head.y < 0) {
                head.y = CONFIG.gridSize - 1;
            } else if (head.y >= CONFIG.gridSize) {
                head.y = 0;
            }
            
            // 传送门检测
            let teleported = false;
            for (const portal of portals) {
                // 从 pointA 传送到 pointB
                if (head.x === portal.pointA.x && head.y === portal.pointA.y) {
                    head.x = portal.pointB.x + direction.x;
                    head.y = portal.pointB.y + direction.y;
                    teleported = true;
                }
                // 从 pointB 传送到 pointA
                else if (head.x === portal.pointB.x && head.y === portal.pointB.y) {
                    head.x = portal.pointA.x + direction.x;
                    head.y = portal.pointA.y + direction.y;
                    teleported = true;
                }
                
                if (teleported) {
                    // 处理穿墙
                    if (head.x < 0) {
                        head.x = CONFIG.gridSize - 1;
                    } else if (head.x >= CONFIG.gridSize) {
                        head.x = 0;
                    }
                    if (head.y < 0) {
                        head.y = CONFIG.gridSize - 1;
                    } else if (head.y >= CONFIG.gridSize) {
                        head.y = 0;
                    }
                    
                    // 传送后刷新位置
                    generatePortals();
                    SoundFX.playPortal();
                    break;
                }
            }
            
            // 加速拖尾
            if (boosting) {
                boostTrail.push({ x: head.x, y: head.y });
                if (boostTrail.length > BOOST_TRAIL_MAX) boostTrail.shift();
            }
            
            // 碰撞检测 - 自身（传送后可能撞到自己）
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }
            
            // 添加新头部
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += boosting ? 20 : 10;
                scoreEl.textContent = score;
                generateFood();
                SoundFX.playEat();
                
                // 检查是否需要增加速度
                if (score - lastSpeedIncreaseScore >= CONFIG.speedIncreaseScore) {
                    increaseSpeed();
                    lastSpeedIncreaseScore = score;
                }
            } else {
                // 没吃到食物，移除尾巴
                snake.pop();
            }
        }

        // 增加速度
        function increaseSpeed() {
            if (currentSpeed > CONFIG.minSpeed) {
                currentSpeed = Math.max(CONFIG.minSpeed, currentSpeed - CONFIG.speedDecrement);
                if (gameState === GAME_STATE.PLAYING && !boosting) {
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, currentSpeed);
                }
            }
        }

        // 游戏结束
        function gameOver() {
            gameState = GAME_STATE.GAME_OVER;
            SoundFX.playDeath();
            if (gameLoop) clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore);
                highScoreEl.textContent = highScore;
                SoundFX.playHighScore();
            }
            
            saveHistory(score);
            
            renderGameOver();
        }

        // 暂停/继续
        function togglePause() {
            if (gameState === GAME_STATE.PLAYING) {
                gameState = GAME_STATE.PAUSED;
                if (gameLoop) clearInterval(gameLoop);
            } else if (gameState === GAME_STATE.PAUSED) {
                gameState = GAME_STATE.PLAYING;
                gameLoop = setInterval(update, boosting ? BOOST_INTERVAL : currentSpeed);
            }
        }

        // 绘制暂停遮罩
        function drawPauseOverlay() {
            // 半透明背景
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // PAUSE文字
            ctx.textAlign = 'center';
            ctx.fillStyle = CONFIG.colors.snake;
            ctx.font = '24px "Press Start 2P"';
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 30;
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 20);
            
            // 提示文字
            ctx.font = '10px "Press Start 2P"';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 10;
            ctx.fillText('按空格键继续', canvas.width / 2, canvas.height / 2 + 30);
            
            ctx.shadowBlur = 0;
        }

        // 渲染 - 开始界面
        function renderStartScreen() {
            ctx.fillStyle = CONFIG.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            ctx.fillStyle = CONFIG.colors.snake;
            ctx.font = '14px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 20;
            ctx.fillText('按空格键开始', canvas.width / 2, canvas.height / 2);
            
            ctx.font = '10px "Press Start 2P"';
            ctx.fillStyle = CONFIG.colors.food;
            ctx.shadowColor = CONFIG.colors.food;
            ctx.fillText('SNAKE GAME', canvas.width / 2, canvas.height / 2 - 50);
            ctx.shadowBlur = 0;
        }

        // 渲染 - 游戏画面
        function render() {
            if (gameState !== GAME_STATE.PLAYING && 
                gameState !== GAME_STATE.PAUSED) return;
            
            // 清空画布
            ctx.fillStyle = CONFIG.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            drawGrid();
            
            // 绘制传送门
            drawPortals();
            
            // 绘制食物
            drawFood();
            
            // 绘制蛇
            drawSnake();
            
            // 食物脉冲动画
            foodPulse += 0.1;
            
            // 传送门螺旋和脉冲动画
            portals.forEach(p => {
                p.pulse += 0.08;
                p.spiralA += 0.15;
                p.spiralB += 0.15;
            });
            
            // 如果暂停，显示PAUSE文字
            if (gameState === GAME_STATE.PAUSED) {
                drawPauseOverlay();
            }
            
            // 继续渲染循环（包括暂停状态）
            requestAnimationFrame(render);
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = CONFIG.colors.grid;
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= CONFIG.gridSize; i++) {
                const pos = i * CONFIG.cellSize;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(canvas.width, pos);
                ctx.stroke();
            }
        }
        
        // 绘制传送门
        function drawPortals() {
            portals.forEach(portal => {
                // 绘制两个传送门点（双向）
                drawPortalPoint(portal.pointA, portal.pulse, portal.spiralA);
                drawPortalPoint(portal.pointB, portal.pulse + Math.PI * 0.5, portal.spiralB);
                
                // 绘制连接线（虚线效果）
                drawPortalConnection(portal);
            });
        }
        
        // 绘制传送门点（带螺旋效果）
        function drawPortalPoint(pos, pulse, spiral) {
            const x = pos.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y = pos.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            const baseRadius = CONFIG.cellSize / 2 - 4;
            const pulseRadius = baseRadius + Math.sin(pulse) * 2;
            
            // 发光效果
            ctx.shadowColor = CONFIG.colors.portalGlow;
            ctx.shadowBlur = 15 + Math.sin(pulse) * 8;
            
            // 螺旋效果
            drawSpiral(x, y, spiral, pulseRadius);
            
            // 外圈
            ctx.strokeStyle = CONFIG.colors.portal;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius + 3, 0, Math.PI * 2);
            ctx.stroke();
            
            // 内圈
            ctx.fillStyle = 'rgba(157, 0, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }
        
        // 绘制螺旋效果
        function drawSpiral(x, y, spiralAngle, radius) {
            const lines = 3;
            const turns = 2;
            
            for (let i = 0; i < lines; i++) {
                const lineAngle = (i / lines) * Math.PI * 2 + spiralAngle;
                ctx.strokeStyle = `rgba(255, 0, 128, ${0.4 + (i / lines) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let t = 0; t < turns * Math.PI * 2; t += 0.1) {
                    const currentAngle = lineAngle + t;
                    const r = (t / (turns * Math.PI * 2)) * radius;
                    const px = x + Math.cos(currentAngle) * r;
                    const py = y + Math.sin(currentAngle) * r;
                    
                    if (t === 0) {
                        ctx.moveTo(px, py);
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();
            }
        }
        
        // 绘制传送门连接
        function drawPortalConnection(portal) {
            const x1 = portal.pointA.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y1 = portal.pointA.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            const x2 = portal.pointB.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y2 = portal.pointB.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            
            ctx.shadowColor = CONFIG.colors.portal;
            ctx.shadowBlur = 5;
            
            // 虚线连接
            ctx.strokeStyle = 'rgba(157, 0, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.shadowBlur = 0;
        }

        // 绘制食物
        function drawFood() {
            const x = food.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const y = food.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            const baseRadius = CONFIG.cellSize / 2 - 2;
            const pulseRadius = baseRadius + Math.sin(foodPulse) * 2;
            
            // 发光效果
            ctx.shadowColor = CONFIG.colors.food;
            ctx.shadowBlur = 15 + Math.sin(foodPulse) * 5;
            
            ctx.fillStyle = CONFIG.colors.food;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        // 绘制蛇
        function drawSnake() {
            if (snake.length < 1) return;

            const cs = CONFIG.cellSize;
            const maxR = cs / 2 - 2;
            const minR = cs / 6;

            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            // 绘制加速拖尾
            if (boosting && boostTrail.length > 0) {
                for (let i = 0; i < boostTrail.length; i++) {
                    const t = i / boostTrail.length;
                    const pos = boostTrail[i];
                    const tx = pos.x * cs + cs / 2;
                    const ty = pos.y * cs + cs / 2;
                    const tr = maxR * t * 0.5;
                    ctx.fillStyle = hexToRgba(CONFIG.colors.snake, t * 0.25);
                    ctx.beginPath();
                    ctx.arc(tx, ty, tr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 绘制身体连接线（段与段之间的矩形桥接）
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 8;
            for (let i = 0; i < snake.length - 1; i++) {
                const t = i / Math.max(snake.length - 1, 1);
                const r = minR + (1 - t) * (maxR - minR);
                const alpha = 0.35 + (1 - t) * 0.65;

                const a = snake[i];
                const b = snake[i + 1];

                if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > 1) continue;

                const ax = a.x * cs + cs / 2;
                const ay = a.y * cs + cs / 2;
                const bx = b.x * cs + cs / 2;
                const by = b.y * cs + cs / 2;

                ctx.fillStyle = hexToRgba(CONFIG.colors.snake, alpha);

                if (ax === bx) {
                    const minY = Math.min(ay, by);
                    const maxY = Math.max(ay, by);
                    ctx.fillRect(ax - r, minY, r * 2, maxY - minY);
                } else {
                    const minX = Math.min(ax, bx);
                    const maxX = Math.max(ax, bx);
                    ctx.fillRect(minX, ay - r, maxX - minX, r * 2);
                }
            }

            // 绘制每段圆形节点（从尾到头，头部在最上层）
            for (let i = snake.length - 1; i >= 0; i--) {
                const t = i / Math.max(snake.length - 1, 1);
                const r = minR + (1 - t) * (maxR - minR);
                const alpha = 0.35 + (1 - t) * 0.65;

                const seg = snake[i];
                const cx = seg.x * cs + cs / 2;
                const cy = seg.y * cs + cs / 2;

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);

                if (i === 0) {
                    ctx.fillStyle = CONFIG.colors.snakeHead;
                    ctx.shadowBlur = boosting ? 25 : 15;
                } else {
                    ctx.fillStyle = hexToRgba(CONFIG.colors.snake, alpha);
                    ctx.shadowBlur = boosting ? 15 : 8;
                }
                ctx.fill();
            }

            ctx.shadowBlur = 0;

            // 绘制蛇头细节（眼睛 + 分叉舌头）
            drawSnakeHead(cs, maxR);

            function drawSnakeHead(cs, maxR) {
                const head = snake[0];
                const hx = head.x * cs + cs / 2;
                const hy = head.y * cs + cs / 2;
                const d = direction;

                const eyeDist = 4;
                const eyeR = 3;

                // 根据朝向确定眼睛位置
                let eyes = [];
                if (d.x === 1) eyes = [{ x: hx + 3, y: hy - eyeDist }, { x: hx + 3, y: hy + eyeDist }];
                else if (d.x === -1) eyes = [{ x: hx - 3, y: hy - eyeDist }, { x: hx - 3, y: hy + eyeDist }];
                else if (d.y === -1) eyes = [{ x: hx - eyeDist, y: hy - 3 }, { x: hx + eyeDist, y: hy - 3 }];
                else eyes = [{ x: hx - eyeDist, y: hy + 3 }, { x: hx + eyeDist, y: hy + 3 }];

                ctx.shadowBlur = 0;
                eyes.forEach(e => {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, eyeR, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(e.x + d.x * 1, e.y + d.y * 1, eyeR * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 分叉舌头
                const tongueLen = 8;
                const tb = { x: hx + d.x * (maxR - 1), y: hy + d.y * (maxR - 1) };
                const tt = { x: tb.x + d.x * tongueLen, y: tb.y + d.y * tongueLen };

                const wiggle = Math.sin(Date.now() / 80) * 2;
                const fork = 3;

                ctx.strokeStyle = CONFIG.colors.food;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(tb.x, tb.y);
                ctx.lineTo(tt.x + d.y * wiggle - d.y * fork, tt.y + d.x * wiggle - d.x * fork);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(tb.x, tb.y);
                ctx.lineTo(tt.x + d.y * wiggle + d.y * fork, tt.y + d.x * wiggle + d.x * fork);
                ctx.stroke();
            }
        }

        // 渲染 - 游戏结束
        function renderGameOver() {
            ctx.fillStyle = CONFIG.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            ctx.textAlign = 'center';
            
            // 游戏结束文字
            ctx.fillStyle = CONFIG.colors.food;
            ctx.font = '16px "Press Start 2P"';
            ctx.shadowColor = CONFIG.colors.food;
            ctx.shadowBlur = 20;
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
            
            // 分数
            ctx.fillStyle = CONFIG.colors.snake;
            ctx.font = '12px "Press Start 2P"';
            ctx.shadowColor = CONFIG.colors.snake;
            ctx.shadowBlur = 15;
            ctx.fillText(`SCORE: ${score}`, canvas.width / 2, canvas.height / 2);
            
            // 最高分
            if (score >= highScore) {
                ctx.fillStyle = '#ffff00';
                ctx.shadowColor = '#ffff00';
                ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, canvas.height / 2 + 25);
            }
            
            // 重新开始提示
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px "Press Start 2P"';
            ctx.shadowBlur = 0;
            ctx.fillText('按空格键重新开始', canvas.width / 2, canvas.height / 2 + 60);
        }

        // 控制设置
        function setupControls() {
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case ' ':
                        e.preventDefault();
                        if (gameState === GAME_STATE.IDLE || 
                            gameState === GAME_STATE.GAME_OVER) {
                            startGame();
                        } else if (gameState === GAME_STATE.PLAYING || 
                                   gameState === GAME_STATE.PAUSED) {
                            togglePause();
                        }
                        break;
                    case 'p':
                        togglePause();
                        break;
                    case 'arrowup':
                    case 'w':
                        if (direction !== DIRECTION.DOWN) {
                            if (direction === DIRECTION.UP && gameState === GAME_STATE.PLAYING) {
                                activateBoost();
                            } else {
                                nextDirection = DIRECTION.UP;
                            }
                        }
                        break;
                    case 'arrowdown':
                    case 's':
                        if (direction !== DIRECTION.UP) {
                            if (direction === DIRECTION.DOWN && gameState === GAME_STATE.PLAYING) {
                                activateBoost();
                            } else {
                                nextDirection = DIRECTION.DOWN;
                            }
                        }
                        break;
                    case 'arrowleft':
                    case 'a':
                        if (direction !== DIRECTION.RIGHT) {
                            if (direction === DIRECTION.LEFT && gameState === GAME_STATE.PLAYING) {
                                activateBoost();
                            } else {
                                nextDirection = DIRECTION.LEFT;
                            }
                        }
                        break;
                    case 'arrowright':
                    case 'd':
                        if (direction !== DIRECTION.LEFT) {
                            if (direction === DIRECTION.RIGHT && gameState === GAME_STATE.PLAYING) {
                                activateBoost();
                            } else {
                                nextDirection = DIRECTION.RIGHT;
                            }
                        }
                        break;
                }
            });

            // 触摸控制
            let touchStartX = 0;
            let touchStartY = 0;

            canvas.addEventListener('touchstart', (e) => {
                if (gameState === GAME_STATE.IDLE || 
                    gameState === GAME_STATE.GAME_OVER) {
                    startGame();
                    return;
                }
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                if (gameState !== GAME_STATE.PLAYING) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;
                
                const minSwipe = 30;
                
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > minSwipe && direction !== DIRECTION.LEFT) {
                        nextDirection = DIRECTION.RIGHT;
                    } else if (diffX < -minSwipe && direction !== DIRECTION.RIGHT) {
                        nextDirection = DIRECTION.LEFT;
                    }
                } else {
                    if (diffY > minSwipe && direction !== DIRECTION.UP) {
                        nextDirection = DIRECTION.DOWN;
                    } else if (diffY < -minSwipe && direction !== DIRECTION.DOWN) {
                        nextDirection = DIRECTION.UP;
                    }
                }
            }, { passive: true });
        }

        // 设置静音按钮
        function setupMuteButton() {
            const muteBtn = document.getElementById('muteBtn');
            SoundFX.loadMuteState();
            updateMuteButton();

            muteBtn.addEventListener('click', () => {
                SoundFX.init();
                SoundFX.toggleMute();
                updateMuteButton();
            });

            function updateMuteButton() {
                muteBtn.textContent = SoundFX.muted ? '🔇' : '🔊';
                muteBtn.classList.toggle('muted', SoundFX.muted);
            }
        }

        // 历史得分
        const HISTORY_KEY = 'snake_history';
        const MAX_HISTORY = 20;

        function saveHistory(score) {
            const history = loadHistory();
            history.push({
                score: score,
                length: snake.length,
                date: new Date().toISOString()
            });
            history.sort((a, b) => b.score - a.score);
            if (history.length > MAX_HISTORY) {
                history.length = MAX_HISTORY;
            }
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch(e) {
                return [];
            }
        }

        function renderHistory() {
            const listEl = document.getElementById('historyList');
            const history = loadHistory();

            if (history.length === 0) {
                listEl.innerHTML = '<div class="history-empty">暂无记录</div>';
                return;
            }

            listEl.innerHTML = history.map((entry, i) => {
                const d = new Date(entry.date);
                const dateStr = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                return `<div class="history-row">
                    <span class="rank">#${i + 1}</span>
                    <span class="score">${entry.score}</span>
                    <span class="length">${entry.length}节</span>
                    <span class="date">${dateStr}</span>
                </div>`;
            }).join('');
        }

        function toggleHistory() {
            const overlay = document.getElementById('historyOverlay');
            if (overlay.style.display === 'none') {
                renderHistory();
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        function setupHistoryButton() {
            const historyBtn = document.getElementById('historyBtn');
            const overlay = document.getElementById('historyOverlay');
            const closeBtn = document.getElementById('closeHistoryBtn');
            const clearBtn = document.getElementById('clearHistoryBtn');

            historyBtn.addEventListener('click', toggleHistory);

            closeBtn.addEventListener('click', () => {
                overlay.style.display = 'none';
            });

            clearBtn.addEventListener('click', () => {
                localStorage.removeItem(HISTORY_KEY);
                renderHistory();
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.style.display = 'none';
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.style.display !== 'none') {
                    overlay.style.display = 'none';
                }
            });
        }

        // 启动游戏
        init();
    </script>
</body>
</html>
