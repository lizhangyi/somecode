<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 - Snake Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center">
  <div class="text-center p-5">
    <h1 class="title-glow text-[28px] mb-5 font-game">SNAKE GAME</h1>
    <div class="score-board flex justify-between mb-[15px] text-[12px] px-5 py-[10px]">
      <span>SCORE: <span id="score">0</span></span>
      <span class="high-score">BEST: <span id="highScore">0</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls mt-5 text-[10px] text-white/60 leading-[1.8]">
      <kbd>SPACE</kbd> 开始/暂停/重新开始 &nbsp;&nbsp;
      <kbd>P</kbd> 暂停 &nbsp;&nbsp;
      <kbd>方向键</kbd> 或 <kbd>WASD</kbd> 移动
    </div>
    <div class="mt-[15px] flex justify-center items-center gap-[10px]">
      <span class="theme-label">THEME:</span>
      <button class="theme-btn neon-green active" data-theme="neon-green" title="霓虹绿"></button>
      <button class="theme-btn neon-blue" data-theme="neon-blue" title="霓虹蓝"></button>
      <button class="theme-btn fire-red" data-theme="fire-red" title="火焰红"></button>
      <div class="volume-wrapper">
        <button class="mute-btn" id="muteBtn" title="音效开关">🔊</button>
        <div class="volume-popup" id="volumePopup">
          <input type="range" id="volumeSlider" min="0" max="100" value="50" class="volume-slider">
          <span class="volume-label" id="volumeLabel">50</span>
        </div>
      </div>
      <button class="history-open-btn" id="historyBtn" title="历史得分">📊</button>
    </div>
    <div class="touch-hint mt-[15px] text-[10px]" style="color: var(--color-neon-pink);">
      移动端：滑动屏幕控制方向
    </div>
  </div>

  <div class="history-overlay" id="historyOverlay" style="display:none">
    <div class="history-panel">
      <h2>HISTORY</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">暂无记录</div>
      </div>
      <div class="history-actions">
        <button class="history-action-btn" id="clearHistoryBtn">CLEAR</button>
        <button class="history-action-btn" id="closeHistoryBtn">CLOSE</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
