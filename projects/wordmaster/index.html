<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordMaster">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
  <title>WordMaster - 背单词</title>
</head>
<body>

  <!-- 安装横幅 -->
  <div id="installBanner" class="install-banner hidden">
    <span>添加到主屏幕，离线也能背单词</span>
    <button id="installBtn">安装</button>
    <button id="dismissInstall" class="close-banner">&times;</button>
  </div>

  <!-- 顶部导航 -->
  <nav class="nav">
    <span class="nav-title">WordMaster</span>
  </nav>

  <!-- 学习页 -->
  <div id="page-learn" class="page active">
    <div class="main">
      <!-- 统计概览 -->
      <div class="stats-row">
        <div class="stat-card" style="cursor:pointer" onclick="document.querySelector('[data-page=stats]').click()">
          <div class="stat-label">待复习</div>
          <div class="stat-value war" id="stat-due-top">-</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="document.querySelector('[data-page=stats]').click()">
          <div class="stat-label">已掌握</div>
          <div class="stat-value suc" id="stat-learned-top">-</div>
        </div>
      </div>

      <!-- 闪卡区域 -->
      <div id="cardContainer">
        <div class="card-container">
          <div class="card-flip" id="cardFlip">
            <div class="card-face card-front">
              <div class="card-word" id="frontWord">-</div>
              <div class="card-phonetic" id="frontPhonetic"></div>
              <div class="card-hint">点击翻转查看释义</div>
            </div>
            <div class="card-face card-back">
              <div class="card-meaning" id="backMeaning">-</div>
              <div class="card-example" id="backExample"></div>
              <div class="card-phonetic" id="backPhonetic" style="margin-top:12px"></div>
              <span class="card-pos" id="backPos" style="display:none"></span>
            </div>
          </div>
        </div>

        <!-- 评分按钮 -->
        <div class="rating-bar" id="ratingBar" style="opacity:0">
          <button class="rating-btn again" data-quality="0">不认识</button>
          <button class="rating-btn hard" data-quality="2">模糊</button>
          <button class="rating-btn good" data-quality="4">认识</button>
          <button class="rating-btn easy" data-quality="5">很熟</button>
        </div>

        <!-- 进度 -->
        <div class="progress-bar-wrapper">
          <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-text">
          <span id="progressText">0/0</span>
          <span id="progressRemain">加载中...</span>
        </div>
      </div>

      <!-- 完成状态 -->
      <div id="doneState" style="display:none">
        <div class="empty-state">
          <span class="done-check">🎉</span>
          <div class="empty-title">今日任务完成！</div>
          <div class="empty-desc" style="margin-bottom:20px">
            今天学了 <strong id="doneCount">0</strong> 个单词<br>
            明天记得来复习哦
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 统计页 -->
  <div id="page-stats" class="page">
    <div class="main">
      <div style="text-align:center; padding: 16px 0">
        <div style="font-size:3rem; font-weight:700; letter-spacing:-1px" id="stat-streak">0</div>
        <div class="stat-label">连续打卡天数</div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">总词数</div>
          <div class="stat-value pri" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">已学习</div>
          <div class="stat-value suc" id="stat-learned">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">掌握率</div>
          <div class="stat-value pur" id="stat-pct">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">待复习</div>
          <div class="stat-value war" id="stat-due">0</div>
        </div>
      </div>
      <div class="stat-card" style="margin-bottom:8px">
        <div class="stat-label">牢固掌握（复习3次以上）</div>
        <div class="stat-value" style="font-size:1.1rem" id="stat-master">0</div>
      </div>
    </div>
  </div>

  <!-- 设置页 -->
  <div id="page-settings" class="page">
    <div class="main">
      <div class="section-title">学习设置</div>
      <div class="setting-item">
        <span class="setting-label">每日目标</span>
        <span class="setting-value">
          <select id="dailyGoalSelect" onchange="changeDailyGoal(this.value)">
            <option value="10">10 词/天</option>
            <option value="20">20 词/天</option>
            <option value="30" selected>30 词/天</option>
            <option value="50">50 词/天</option>
            <option value="100">100 词/天</option>
          </select>
        </span>
      </div>

      <div class="section-title">数据管理</div>
      <div class="setting-item" style="cursor:pointer" onclick="resetProgress()">
        <span class="setting-label">重置学习进度</span>
        <span class="setting-value" style="color:var(--danger)">重置 &rarr;</span>
      </div>

      <div class="section-title">关于</div>
      <div class="setting-item">
        <span class="setting-label">词库</span>
        <span class="setting-value">雅思 + 六级高频 210 词</span>
      </div>
      <div class="setting-item">
        <span class="setting-label">算法</span>
        <span class="setting-value">SM-2 间隔重复</span>
      </div>
      <div class="setting-item">
        <span class="setting-label">版本</span>
        <span class="setting-value">v1.0 — PWA</span>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="tab-bar">
    <button class="tab active" data-page="learn">
      <span class="tab-icon">&#x1F4DA;</span>
      <span>学习</span>
    </button>
    <button class="tab" data-page="stats">
      <span class="tab-icon">&#x1F4CA;</span>
      <span>统计</span>
    </button>
    <button class="tab" data-page="settings">
      <span class="tab-icon">&#x2699;&#xFE0F;</span>
      <span>设置</span>
    </button>
  </nav>

  <script src="js/words.js"></script>
  <script src="js/sm2.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>

  <script>
    setInterval(async () => {
      try {
        const stats = await getStats();
        document.getElementById('stat-due-top').textContent = stats.due;
        document.getElementById('stat-learned-top').textContent = stats.learned;
      } catch(e) {}
    }, 5000);
  </script>
</body>
</html>
